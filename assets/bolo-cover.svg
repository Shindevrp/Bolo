  <text x="634" y="93" text-anchor="middle" font-family="'Fira Code', ui-monospace, monospace" font-size="12" fill="#8b949e">responds</text>

  <path d="M 705 162 Q 450 212 195 162" fill="none" stroke="#30363d" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowDim)"/>
  <text x="450" y="208" text-anchor="middle" font-family="'Fira Code', ui-monospace, monospace" font-size="11" letter-spacing="1.5" fill="#6e7681">TURN-TAKING · BARGE-IN · BACKCHANNEL</text>
