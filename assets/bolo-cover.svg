  </defs>

  <rect x="40" y="65" width="190" height="90" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="135" y="106" text-anchor="middle" font-family="'Fira Code', ui-monospace, monospace" font-size="20" font-weight="700" letter-spacing="2" fill="#79c0ff">SPEECH</text>
