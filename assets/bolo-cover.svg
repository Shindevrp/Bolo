  <text x="765" y="130" text-anchor="middle" font-family="'Fira Code', ui-monospace, monospace" font-size="11" letter-spacing="1.5" fill="#8b949e">YOU HEAR</text>

  <rect x="350" y="45" width="200" height="130" rx="22" fill="url(#boloGrad)" stroke="#1f6feb" stroke-width="2"/>
  <text x="450" y="98" text-anchor="middle" font-family="'Fira Code', ui-monospace, monospace" font-size="42" font-weight="800" letter-spacing="8" fill="#ffffff">BOLO</text>
  <text x="450" y="130" text-anchor="middle" font-family="'Fira Code', ui-monospace, monospace" font-size="11.5" letter-spacing="1.5" fill="#e6edf3">REAL-TIME VOICE AGENT</text>

  <line x1="232" y1="110" x2="300" y2="110" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="600" y1="110" x2="668" y2="110" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow)"/>
