name: bolo-demo

# One-command CPU-first demo. Runs anywhere Docker does (no GPU required).
# On a machine with a GPU + nvidia-container-toolkit, add the GPU override:
#   docker compose -f docker-compose.demo.yml -f docker-compose.demo.gpu.yml up
#
# Customize with BOLO_DEMO_* env vars (not BOLO_*: those are for the Bolo app itself
# itself and this stack pins them so a machine-local .env can't break the demo):
#   BOLO_DEMO_LLM_MODEL  Ollama model tag to pull+use          (default qwen2.5:3b)
#   BOLO_DEMO_STT_MODEL  faster-whisper model size             (default tiny)

services:

  ollama:
    image: ollama/ollama:latest
    container_name: bolo-demo-ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    container_name: bolo-demo-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${BOLO_DEMO_LLM_MODEL:-qwen2.5:3b}"]
    restart: "no"

  bolo:
    build: .
    image: bolo-demo:local
    container_name: bolo-demo-app
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    environment:
      BOLO_LLM_URL: http://ollama:11434/v1
      BOLO_LLM_MODEL: ${BOLO_DEMO_LLM_MODEL:-qwen2.5:3b}
      BOLO_STT_MODEL: ${BOLO_DEMO_STT_MODEL:-tiny}
      BOLO_STT_DEVICE: auto
      BOLO_STT_COMPUTE: int8
      BOLO_VAD_DEVICE: auto
      BOLO_VAD_THRESHOLD: "0.5"
      BOLO_EMOTION_ENABLED: "0"
      BOLO_TTS_MODEL: /app/models/piper/en_US-lessac-medium.onnx
      # SerpApi drives search_web. Empty = keyless, and search_web falls back
      # to DuckDuckGo Instant Answers then Wikipedia. Free tier: 250/mo.
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      SERPAPI_CREDIT_CAP: ${SERPAPI_CREDIT_CAP:-200}
      SERPAPI_GL: ${SERPAPI_GL:-in}
    ports:
      - "${BOLO_DEMO_APP_PORT:-8000}:8000"
    volumes:
      - model_cache:/root/.cache
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 120s
    restart: unless-stopped

  dashboard:
    build: .
    image: bolo-demo:local
    container_name: bolo-demo-dashboard
    depends_on:
      bolo:
        condition: service_healthy
    environment:
      BOLO_BACKEND_URL: http://bolo:8000
      BOLO_UI_URL: http://localhost:8000
    command:
      - "streamlit"
      - "run"
      - "streamlit_app.py"
      - "--server.address"
      - "0.0.0.0"
      - "--server.port"
      - "8501"
      - "--server.headless"
      - "true"
    ports:
      - "${BOLO_DEMO_DASHBOARD_PORT:-8501}:8501"
    restart: unless-stopped

  bench:
    image: bolo-demo:local
    container_name: bolo-demo-bench
    depends_on:
      bolo:
        condition: service_healthy
    environment:
      BOLO_JUDGE_URL: http://ollama:11434/v1
      BOLO_JUDGE_MODEL: ${BOLO_DEMO_LLM_MODEL:-qwen2.5:3b}
    command:
      - "python"
      - "-m"
      - "bench.cli"
      - "run"
      - "--agent"
      - "bolo-ws"
      - "--base-url"
      - "ws://bolo:8000/ws/audio"
      - "--judge-llm-url"
      - "http://ollama:11434/v1"
      - "--judge-model"
      - "${BOLO_DEMO_LLM_MODEL:-qwen2.5:3b}"
      - "--limit"
      - "6"
      - "--out"
      - "/app/out/report.json"
      - "--label"
      - "docker-demo"
    volumes:
      - bench_out:/app/out
    restart: "no"

volumes:
  ollama_data:
  model_cache:
  bench_out:
