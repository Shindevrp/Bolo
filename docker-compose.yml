services:

  vllm:
    image: vllm/vllm-openai:latest
    container_name: bolo-vllm
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - MODEL=${BOLO_LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}
      - MAX_MODEL_LEN=${BOLO_VLLM_MAX_LEN:-4096}
      - GPU_MEMORY_UTILIZATION=${BOLO_VLLM_GPU_UTIL:-0.90}
      - DTYPE=${BOLO_VLLM_DTYPE:-float16}
      - QUANTIZATION=awq
      - API_KEY=${BOLO_VLLM_API_KEY:-EMPTY}
    command:
      - "--model"
      - "${BOLO_LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}"
      - "--max-model-len"
      - "${BOLO_VLLM_MAX_LEN:-4096}"
      - "--gpu-memory-utilization"
      - "${BOLO_VLLM_GPU_UTIL:-0.90}"
      - "--dtype"
      - "${BOLO_VLLM_DTYPE:-float16}"
      - "--quantization"
      - "awq"
      - "--port"
      - "8000"
      - "--host"
      - "0.0.0.0"
    ports:
      - "8001:8000"
    volumes:
      - vllm_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - bolo-net

  bolo:
    build: .
    container_name: bolo-app
    depends_on:
      vllm:
        condition: service_healthy
    environment:
      - BOLO_LLM_URL=http://vllm:8000/v1
      - BOLO_LLM_MODEL=${BOLO_LLM_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}
      - BOLO_STT_MODEL=${BOLO_STT_MODEL:-base}
      - BOLO_STT_DEVICE=${BOLO_STT_DEVICE:-cpu}
      - BOLO_STT_COMPUTE=int8
      - BOLO_TTS_MODEL=/app/models/piper/en_US-lessac-medium.onnx
      - BOLO_VAD_THRESHOLD=0.5
    ports:
      - "8000:8000"
    volumes:
      - stt_cache:/root/.cache
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - bolo-net

volumes:
  vllm_cache:
  stt_cache:

networks:
  bolo-net:
    driver: bridge