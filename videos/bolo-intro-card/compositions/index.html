  Built IN PLACE from the `titlecard-lockup` block (hyperframes add
  titlecard-lockup -> compositions/components/titlecard-lockup.html), customized
  per shot-plan.json. Block roles kept: wordmark slot (.tl-wordmark), hairline
  rule slot (.tl-rule-svg / .tl-rule), mono label slot (.tl-label). The optional
  kicker slot is removed (the brief specifies exactly three text elements). The
  tagline is a NEW element — the block ships no tagline slot.

  Hand-authored (reported search misses, no catalog block fits):
    the voice->search motif — smooth sine polyline -> empty pill field outline
    -> one caret blink -> the wave's breath. Patterns borrowed from
    `outline-draw` (clean rounded-outline closure) and `svg-line-draw-loader`
    (measured strokeDashoffset draw), inlined into THIS timeline so the wave and
    the field share one clock and hand off as one unbroken gesture.

  All motion on ONE paused root timeline registered on window.__timelines.
  Deterministic: no Date.now(), no Math.random(), no network.

  Mount contract: the runtime clones only this template. #root fills the host
  box, establishes the container query basis, has no data-width or
  data-height, and registers one paused timeline under its own composition id.
-->

              [0.945, 0.3],
            ];

            // Split the query into per-glyph spans so each can fade in on the
            // typing stagger. Spaces get a span too, or the words run together
            // as the stagger advances.
            var QUERY_TEXT = "flights DEL to BOM tomorrow";
            query.textContent = "";
            var queryChars = [];
            for (var q = 0; q < QUERY_TEXT.length; q++) {
              var ch = document.createElement("span");
              ch.textContent = QUERY_TEXT.charAt(q);
              ch.style.display = "inline-block";
              ch.style.whiteSpace = "pre";
              query.appendChild(ch);
              queryChars.push(ch);
            }

            var tl = gsap.timeline({ paused: true });

            // ---- s1 wordmark -------------------------------------------------
            // 0.10-1.50 fade_in + fade_blur as one real filter tween.
            tl.fromTo(
              wordmark,
              { autoAlpha: 0, y: 14, filter: "blur(10px)" },
              {
                autoAlpha: 1,
                y: 0,
                filter: "blur(0px)",
                duration: 1.4,
                ease: "power3.out",
              },
              0.1,
            );

            // 1.50-1.95 the block's signature rule draw, left to right.
            tl.fromTo(
              rule,
              { strokeDashoffset: ruleLength },
              { strokeDashoffset: 0, duration: 0.45, ease: "power2.inOut" },
              1.5,
            );

            // 2.20-3.10 exactly one accent bloom over the letters, then it dies.
            // immediateRender:false keeps this tween's from-value off the
            // wordmark's pre-entrance resting state.
            tl.fromTo(
              wordmark,
              { textShadow: glowOff },
              {
                textShadow: glowOn,
                duration: 0.45,
                ease: "sine.inOut",
                yoyo: true,
                repeat: 1,
                immediateRender: false,
              },
              2.2,
            );

            // ---- s2 tagline --------------------------------------------------
            // Whole-line rise with a 0.04s whisper of per-word stagger.
            tl.fromTo(
              taglineWords,
              { autoAlpha: 0, y: 10 },
              {
                autoAlpha: 1,
                y: 0,
                duration: 1.1,
                ease: "power3.out",
                stagger: 0.04,
              },
              3.2,
            );

            // ---- s3 motif: one unbroken gesture, voice -> search -------------
            // The wave is a speech envelope: 13 syllable bursts of differing
            // amplitude separated by near-silence, drawn as a measured stroke.
            // 4.60-5.40 it draws on left to right.
            tl.fromTo(
              wave,
              { strokeDashoffset: waveLength },
              { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" },
              4.6,
            );

            // 5.30-5.90 no gap, no lift: the same stroke continues from the wave's
            // tail into the field and closes cleanly, decelerating into closure.
            tl.fromTo(
              field,
              { strokeDashoffset: fieldLength },
              { strokeDashoffset: 0, duration: 0.6, ease: "power1.inOut" },
              5.3,
            );

            // 5.80-6.10 the magnifier pops, scaled from its own centre.
            tl.fromTo(
              searchIcon,
              { autoAlpha: 0, scale: 0.55 },
              { autoAlpha: 1, scale: 1, duration: 0.3, ease: "power3.out" },
              5.8,
            );

            // 6.10-7.40 the example query types itself in. Per-glyph fade with a
            // tight stagger reads as typing and needs no measured pixel width, so
            // it cannot drift when the webfont resolves.
            tl.fromTo(
              queryChars,
              { autoAlpha: 0 },
              { autoAlpha: 1, duration: 0.08, ease: "none", stagger: 0.045 },
              6.1,
            );

            // 6.10-8.60 the wave SPEAKS. One scaleY swell per syllable, on the
            // same clock the drawn bursts sit on, so the pulse tracks the shape
            // instead of merely breathing under it. The field NEVER pulses — the
            // voice is alive, the search is waiting.
            //
            // Explicit fromTo rather than to(), so each hop states both of its
            // own endpoints and stays correct when seeked into out of order.
            // immediateRender:false keeps GSAP from stamping a from-value onto
            // the element at authoring time, which would otherwise make the
            // last-authored hop the resting state for any pre-first-tween seek.
            var speechStart = 6.1;
            var syllableGap = 0.19;
            tl.set(waveBox, { scaleY: 1 }, 0);
            for (var b = 0; b < BURSTS.length; b++) {
              // Floor the amplitude: a scaleY of 0 collapses the matrix to NaN.
              // The quietest burst still needs a visible swell.
              var amp = 0.92 + BURSTS[b][2] * 0.16;
              tl.fromTo(
                waveBox,
                { scaleY: 1 },
                {
                  scaleY: amp,
                  duration: 0.07,
                  ease: "sine.out",
                  immediateRender: false,
                },
                speechStart + b * syllableGap,
              );
              tl.fromTo(
                waveBox,
                { scaleY: amp },
                {
                  scaleY: 1,
                  duration: 0.11,
                  ease: "sine.inOut",
                  immediateRender: false,
                },
                speechStart + b * syllableGap + 0.07,
              );
            }

            // 7.50-7.95 the caret blinks once at the end of the query and settles
            // lit, so the last frame reads as "typed, waiting to run".
            tl.fromTo(
              caret,
              { opacity: 0 },
              { opacity: 1, duration: 0.12, ease: "sine.out" },
              7.5,
            );
            tl.to(caret, { opacity: 0, duration: 0.12, ease: "sine.in" }, 7.78);
            tl.to(caret, { opacity: 1, duration: 0.12, ease: "sine.out" }, 7.95);

            // ---- s4 metadata line --------------------------------------------
            // 7.90-8.90. Whole line, opacity only — the last 1.1s must be clean
            // for the cut, and the query above is still finishing its blink.
            tl.fromTo(
              metaLine,
              { autoAlpha: 0, y: 8 },
              { autoAlpha: 1, y: 0, duration: 1.0, ease: "power3.out" },
              7.9,
            );

            // 8.90-10.00 nothing arrives, nothing exits. Only the tail of the
            // speech swells is still moving in the frame.

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["bolo-intro-card"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
